<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insane Asylum Room - Panoramic View with Object Detection</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
            background-color: #000;
        }
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 20px;
            border-radius: 10px;
        }
        #imageContainer {
            position: relative;
            height: 100%;
            transform-origin: center center;
            transition: transform 0.1s ease;
        }
        #panoramaImage {
            height: 100%;
            display: none;
        }
        #detectionCanvas {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            pointer-events: none;
            transform-origin: center center;
        }
        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 10px;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
        }
        .controls button {
            padding: 8px 15px;
            background: #333;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        .controls button:hover {
            background: #555;
        }
        #statusInfo {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="loading">Generating image of insane asylum room...</div>
        <div id="statusInfo"></div>
        <div id="imageContainer">
            <img id="panoramaImage" alt="Insane Asylum Room">
            <canvas id="detectionCanvas"></canvas>
        </div>
        <div class="controls">
            <button id="zoomIn">Zoom In</button>
            <button id="zoomOut">Zoom Out</button>
            <button id="reset">Reset View</button>
            <button id="redetect">Re-analyze Image</button>
        </div>
    </div>

    <script type="importmap">
    {
      "imports": {
        "@tensorflow/tfjs": "https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0/dist/tf.min.js",
        "@tensorflow-models/coco-ssd": "https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"
      }
    }
    </script>

    <script type="module">
        import * as tf from '@tensorflow/tfjs';
        
        let isDragging = false;
        let startX, startY, translateX = 0, translateY = 0, scale = 1;
        let containerWidth, containerHeight, imageWidth, imageHeight;
        let initialTranslateX = 0;
        let currentDetections = [];
        let generatedImageUrl = '';

        function setupPanoramicViewer() {
            const container = document.getElementById('container');
            const imageContainer = document.getElementById('imageContainer');
            const panoramaImage = document.getElementById('panoramaImage');

            containerWidth = container.clientWidth;
            containerHeight = container.clientHeight;
            imageWidth = panoramaImage.naturalWidth;
            imageHeight = panoramaImage.naturalHeight;

            initialTranslateX = (containerWidth - imageWidth) / 2;
            translateX = initialTranslateX;

            updateTransform();

            container.addEventListener('mousedown', (e) => {
                isDragging = true;
                startX = e.clientX - translateX;
                startY = e.clientY - translateY;
                container.style.cursor = 'grabbing';
            });

            container.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                translateX = e.clientX - startX;
                translateY = e.clientY - startY;

                translateY = Math.max(Math.min(translateY, containerHeight / 2), -imageHeight * scale + containerHeight / 2);

                updateTransform();
            });

            container.addEventListener('mouseup', () => {
                isDragging = false;
                container.style.cursor = 'grab';
            });

            container.addEventListener('mouseleave', () => {
                isDragging = false;
                container.style.cursor = 'grab';
            });

            document.getElementById('zoomIn').addEventListener('click', () => {
                scale = Math.min(scale * 1.2, 3);
                updateTransform();
            });

            document.getElementById('zoomOut').addEventListener('click', () => {
                scale = Math.max(scale / 1.2, 0.5);
                updateTransform();
            });

            document.getElementById('reset').addEventListener('click', () => {
                scale = 1;
                translateX = initialTranslateX;
                translateY = 0;
                updateTransform();
            });

            document.getElementById('redetect').addEventListener('click', async () => {
                if (generatedImageUrl) {
                    document.getElementById('loading').style.display = 'block';
                    document.getElementById('loading').innerText = 'Re-analyzing image...';
                    try {
                        const detections = await detectWithCustomMethod(generatedImageUrl);
                        if (detections && detections.length > 0) {
                            drawDetections(detections, document.getElementById('detectionCanvas'), imageWidth, imageHeight);
                        } else {
                            const simulated = createSimulatedDetections(imageWidth, imageHeight);
                            drawDetections(simulated, document.getElementById('detectionCanvas'), imageWidth, imageHeight);
                        }
                    } catch (error) {
                        console.error("Re-analysis failed:", error);
                    }
                    document.getElementById('loading').style.display = 'none';
                }
            });

            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                const delta = e.deltaY > 0 ? 0.9 : 1.1;
                scale = Math.max(0.5, Math.min(scale * delta, 3));
                updateTransform();
            });

            container.style.cursor = 'grab';
        }

        function updateTransform() {
            const imageContainer = document.getElementById('imageContainer');
            imageContainer.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;

            if (currentDetections && currentDetections.length > 0) {
                drawDetections(currentDetections, document.getElementById('detectionCanvas'), imageWidth, imageHeight);
            }
        }

        function drawDetections(detections, canvas, imageWidth, imageHeight) {
            const ctx = canvas.getContext('2d');
            canvas.width = imageWidth;
            canvas.height = imageHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            currentDetections = detections;

            const statusInfo = document.getElementById('statusInfo');
            statusInfo.innerHTML = `Detected ${detections.length} objects<br>Drag to explore, use wheel or buttons to zoom`;

            const colorMap = {
                'bed': '#8B4513',
                'patient bed': '#8B4513',
                'hospital bed': '#8B4513',
                'chair': '#556B2F',
                'wheelchair': '#2F4F4F',
                'restraint': '#8B0000',
                'window': '#4682B4',
                'barred window': '#4682B4',
                'door': '#A0522D',
                'cabinet': '#A52A2A',
                'medical cabinet': '#A52A2A',
                'medical equipment': '#483D8B',
                'sink': '#5F9EA0',
                'light': '#DAA520',
                'lamp': '#DAA520',
                'table': '#8B0000',
                'default': '#FF4500'
            };

            detections.forEach(detection => {
                const [x, y, width, height] = detection.bbox;
                const objectClass = detection.class.toLowerCase();

                let color = colorMap.default;
                for (const key in colorMap) {
                    if (objectClass.includes(key)) {
                        color = colorMap[key];
                        break;
                    }
                }

                ctx.lineWidth = 3;
                ctx.strokeStyle = color;
                ctx.strokeRect(x, y, width, height);
                
                ctx.fillStyle = `${color}33`; 
                ctx.fillRect(x, y, width, height);

                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                const label = `${detection.class} ${Math.round(detection.score * 100)}%`;
                const textWidth = ctx.measureText(label).width + 10;
                ctx.fillRect(x, y > 24 ? y - 24 : y, textWidth, 24);

                ctx.font = 'bold 16px Arial';
                ctx.fillStyle = '#FFFFFF';
                ctx.fillText(
                    label,
                    x + 5, y > 20 ? y - 8 : y + 18
                );
            });
        }

        async function detectWithCustomMethod(imageUrl) {
            try {
                const statusInfo = document.getElementById('statusInfo');
                statusInfo.innerHTML = 'Analyzing image objects with AI vision...';

                const panoramaImage = document.getElementById('panoramaImage');
                const imgWidth = panoramaImage.naturalWidth;
                const imgHeight = panoramaImage.naturalHeight;

                try {
                    const completion = await websim.chat.completions.create({
                        messages: [
                            {
                                role: "system",
                                content: `You are a computer vision expert specializing in YOLO-style object detection.
                                Your task is to identify objects in a mental asylum room image and provide precise 
                                bounding box coordinates for each object using absolute positioning.`
                            },
                            {
                                role: "user",
                                content: [
                                    {
                                        type: "text",
                                        text: `Perform YOLO-style object detection on this image of an abandoned asylum room.
                                        Be very precise with bounding box coordinates.
                                        For each object detected, provide:
                                        1. Object class (be specific and relevant to asylum setting)
                                        2. Confidence score (between 0.7-0.99)
                                        3. Bounding box coordinates as [x, y, width, height] values (in 0-1 range)
                                           where x,y is the top-left corner.
                                        
                                        Respond with JSON only, following this exact format:
                                        {
                                            "detections": [
                                                {
                                                    "class": "object name",
                                                    "score": 0.95,
                                                    "bbox": [0.1, 0.4, 0.3, 0.2]
                                                },
                                                ...more objects...
                                            ]
                                        }
                                        
                                        Be thorough - detect at least 6-10 objects in the scene if possible.
                                        Include asylum-specific items like medical equipment, restraints, beds, 
                                        cabinets, windows with bars, doors, etc.`
                                    },
                                    {
                                        type: "image_url",
                                        image_url: { url: imageUrl }
                                    }
                                ]
                            }
                        ],
                        json: true
                    });

                    statusInfo.innerHTML = 'Processing detection results...';
                    
                    const result = JSON.parse(completion.content);

                    if (result.detections && Array.isArray(result.detections)) {
                        const processed = result.detections.map(detection => {
                            const [relX, relY, relWidth, relHeight] = detection.bbox;
                            return {
                                class: detection.class,
                                score: detection.score,
                                bbox: [
                                    Math.floor(relX * imgWidth), 
                                    Math.floor(relY * imgHeight), 
                                    Math.floor(relWidth * imgWidth), 
                                    Math.floor(relHeight * imgHeight)
                                ]
                            };
                        });

                        console.log("LLM vision detection successful, found", processed.length, "objects");
                        return processed;
                    } else {
                        throw new Error("Invalid detection format returned");
                    }
                } catch (firstAttemptError) {
                    console.error("First detection method failed:", firstAttemptError);
                    
                    try {
                        statusInfo.innerHTML = 'Attempting alternative detection method...';
                        
                        const backupCompletion = await websim.chat.completions.create({
                            messages: [
                                {
                                    role: "system",
                                    content: `You are a YOLO object detection algorithm. Analyze the image precisely.`
                                },
                                {
                                    role: "user",
                                    content: [
                                        {
                                            type: "text",
                                            text: `Divide this asylum room image into a 3x3 grid. For each grid cell:
                                            1. Identify the main object in that area
                                            2. Specify the precise location with x,y coordinates (0-1 range) for top-left corner
                                            3. Provide width and height values (0-1 range)
                                            
                                            Respond with JSON only:
                                            {
                                                "detections": [
                                                    {
                                                        "class": "string",
                                                        "score": number,
                                                        "bbox": [x, y, width, height]
                                                    }
                                                ]
                                            }`
                                        },
                                        {
                                            type: "image_url",
                                            image_url: { url: imageUrl }
                                        }
                                    ]
                                }
                            ],
                            json: true
                        });
                        
                        const backupResult = JSON.parse(backupCompletion.content);
                        
                        if (backupResult.detections && Array.isArray(backupResult.detections)) {
                            const processed = backupResult.detections.map(detection => {
                                const [relX, relY, relWidth, relHeight] = detection.bbox;
                                return {
                                    class: detection.class,
                                    score: detection.score,
                                    bbox: [
                                        Math.floor(relX * imgWidth), 
                                        Math.floor(relY * imgHeight), 
                                        Math.floor(relWidth * imgWidth), 
                                        Math.floor(relHeight * imgHeight)
                                    ]
                                };
                            });
                            
                            console.log("Backup detection successful, found", processed.length, "objects");
                            return processed;
                        } else {
                            throw new Error("Invalid backup detection format");
                        }
                    } catch (secondAttemptError) {
                        console.error("Second detection method failed:", secondAttemptError);
                        
                        statusInfo.innerHTML = 'Trying final detection method...';
                        
                        try {
                            const finalCompletion = await websim.chat.completions.create({
                                messages: [
                                    {
                                        role: "user",
                                        content: [
                                            {
                                                type: "text",
                                                text: `For this asylum room image, list 8-10 objects with their:
                                                1. Name
                                                2. Exact position (x,y coordinates from 0-1 where 0,0 is top-left)
                                                3. Size (width,height from 0-1)
                                                
                                                Example format for each object:
                                                "Patient bed: [0.2, 0.5, 0.4, 0.3]"
                                                
                                                Be precise and detailed with positions - these will be used directly for bounding boxes.`
                                            },
                                            {
                                                type: "image_url",
                                                image_url: { url: imageUrl }
                                            }
                                        ]
                                    }
                                ]
                            });
                            
                            const textResponse = finalCompletion.content;
                            console.log("Using simplified detection with text response");
                            
                            return parseTextIntoDetections(textResponse, imgWidth, imgHeight);
                        } catch (finalError) {
                            console.error("Final detection method failed:", finalError);
                            return null;
                        }
                    }
                }
            } catch (error) {
                console.error("All detection methods failed:", error);
                return null;
            }
        }
        
        function parseTextIntoDetections(text, imgWidth, imgHeight) {
            const detections = [];
            const lines = text.split('\n');
            
            const pattern = /(?:\d+\.\s*)?([^:[\]]+)(?::)?\s*\[([0-9.]+),\s*([0-9.]+),\s*([0-9.]+),\s*([0-9.]+)\]/i;
            
            for (const line of lines) {
                const match = line.match(pattern);
                if (match) {
                    const [_, objectName, x, y, width, height] = match;
                    
                    const detection = {
                        class: objectName.trim(),
                        score: 0.8 + Math.random() * 0.15, 
                        bbox: [
                            Math.floor(parseFloat(x) * imgWidth),
                            Math.floor(parseFloat(y) * imgHeight),
                            Math.floor(parseFloat(width) * imgWidth),
                            Math.floor(parseFloat(height) * imgHeight)
                        ]
                    };
                    
                    detections.push(detection);
                }
            }
            
            return detections.length > 0 ? detections : null;
        }

        async function main() {
            try {
                document.getElementById('loading').innerText = 'Generating high-detail image of asylum room...';
                const result = await websim.imageGen({
                    prompt: "A detailed panoramic view of an abandoned insane asylum room with peeling wallpaper, old medical equipment, broken furniture, eerie lighting through barred windows, and disturbing details. Cinematic, hyper-realistic, high detail, creepy atmosphere.",
                    width: 1792,  
                    height: 1024
                });

                console.log("Image generated:", result.url);
                generatedImageUrl = result.url;

                const panoramaImage = document.getElementById('panoramaImage');
                panoramaImage.crossOrigin = "Anonymous";
                panoramaImage.src = result.url;

                await new Promise((resolve) => {
                    panoramaImage.onload = resolve;
                });

                panoramaImage.style.display = 'block';

                setupPanoramicViewer();

                document.getElementById('loading').innerText = 'Analyzing objects in the image (YOLO-style detection)...';

                imageWidth = panoramaImage.naturalWidth;
                imageHeight = panoramaImage.naturalHeight;

                const detectionCanvas = document.getElementById('detectionCanvas');

                let detections = await detectWithCustomMethod(result.url);

                if (!detections || detections.length === 0) {
                    document.getElementById('loading').innerText = 'Object detection failed. Please try again.';
                    setTimeout(() => {
                        document.getElementById('loading').style.display = 'none';
                    }, 3000);
                    return;
                }

                drawDetections(detections, detectionCanvas, imageWidth, imageHeight);

                document.getElementById('loading').style.display = 'none';

            } catch (error) {
                console.error("Error:", error);
                document.getElementById('loading').innerText = 'Error: ' + error.message;
            }
        }

        window.addEventListener('DOMContentLoaded', main);
    </script>
