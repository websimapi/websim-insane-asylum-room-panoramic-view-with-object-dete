<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insane Asylum Room - Panoramic View with Object Detection</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
            background-color: #000;
        }
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 20px;
            border-radius: 10px;
        }
        #imageContainer {
            position: relative;
            height: 100%;
            transform-origin: center center;
            transition: transform 0.1s ease;
        }
        #panoramaImage {
            height: 100%;
            display: none;
        }
        #detectionCanvas {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            pointer-events: none;
            transform-origin: center center;
        }
        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 10px;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
        }
        .controls button {
            padding: 8px 15px;
            background: #333;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        .controls button:hover {
            background: #555;
        }
        #statusInfo {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 10;
        }
        #detectionSettings {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 10;
        }
        label {
            display: block;
            margin: 5px 0;
        }
        input[type="range"] {
            width: 100%;
        }
        .confidence-slider {
            margin-top: 10px;
        }
        #confidenceThreshold {
            width: 100%;
        }
        .progress-bar {
            width: 100%;
            background-color: #333;
            height: 10px;
            margin: 10px 0;
            border-radius: 5px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background-color: #4CAF50;
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="loading">Generating image of insane asylum room...</div>
        <div id="statusInfo"></div>
        <div id="detectionSettings">
            <label>Object Sensitivity: <span id="objectCountValue">8</span>
                <input type="range" id="objectCount" min="3" max="15" value="8">
            </label>
            <label class="confidence-slider">
                Confidence Threshold: <span id="confidenceValue">70%</span>
                <input type="range" id="confidenceThreshold" min="50" max="95" value="70">
            </label>
            <label>
                <input type="checkbox" id="showLabels" checked> Show Labels
            </label>
            <button id="regenerateDetections">Analyze Image Again</button>
            <div class="progress-bar" id="analysisProgress">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
        <div id="imageContainer">
            <img id="panoramaImage" alt="Insane Asylum Room">
            <canvas id="detectionCanvas"></canvas>
        </div>
        <div class="controls">
            <button id="zoomIn">Zoom In</button>
            <button id="zoomOut">Zoom Out</button>
            <button id="reset">Reset View</button>
        </div>
    </div>

    <script type="module">

        let containerWidth, containerHeight, imageWidth, imageHeight;
        let initialTranslateX = 0;
        let currentDetections = [];
        let generatedImageUrl = '';
        let showLabels = true;
        let confidenceThreshold = 70;
        let imageAnalyzed = false;

        const asylumObjects = [

            {

        const colorMap = {
            'bed': '#A0522D',
            'hospital': '#8B4513',
            'chair': '#6B8E23',
            'wheelchair': '#2F4F4F', 
            'restraint': '#8B0000',
            'window': '#4682B4',
            'barred': '#0078D7',
            'door': '#CD853F',
            'cabinet': '#A52A2A',
            'medical': '#483D8B',
            'medicine': '#8A2BE2',
            'sink': '#5F9EA0',
            'light': '#FFD700',
            'lamp': '#FFA500',
            'table': '#8B0000',
            'blood': '#DC143C',
            'stain': '#B22222',
            'chart': '#708090',
            'electroshock': '#8B008B',
            'trolley': '#20B2AA',
            'waste': '#696969',
            'wallpaper': '#A9A9A9',
            'slippers': '#FF7F50',
            'default': '#FF4500'
        };

        function setupPanoramicViewer() {
            const container = document.getElementById('container');
            const imageContainer = document.getElementById('imageContainer');
            const panoramaImage = document.getElementById('panoramaImage');

            containerWidth = container.clientWidth;
            containerHeight = container.clientHeight;
            imageWidth = panoramaImage.naturalWidth;
            imageHeight = panoramaImage.naturalHeight;

            initialTranslateX = (containerWidth - imageWidth) / 2;
            translateX = initialTranslateX;

            updateTransform();

            container.addEventListener('mousedown', (e) => {
                isDragging = true;
                startX = e.clientX - translateX;
                startY = e.clientY - translateY;
                container.style.cursor = 'grabbing';
            });

            container.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                translateX = e.clientX - startX;
                translateY = e.clientY - startY;

                translateY = Math.max(Math.min(translateY, containerHeight / 2), -imageHeight * scale + containerHeight / 2);
                
                const maxTranslateX = Math.max(containerWidth / 2, containerWidth / 2 * scale);
                const minTranslateX = Math.min(containerWidth - imageWidth * scale - containerWidth / 2, -containerWidth / 2 * scale);
                translateX = Math.max(Math.min(translateX, maxTranslateX), minTranslateX);

                updateTransform();
            });

            container.addEventListener('mouseup', () => {
                isDragging = false;
                container.style.cursor = 'grab';
            });

            container.addEventListener('mouseleave', () => {
                isDragging = false;
                container.style.cursor = 'grab';
            });

            document.getElementById('zoomIn').addEventListener('click', () => {
                scale = Math.min(scale * 1.2, 3);
                updateTransform();
            });

            document.getElementById('zoomOut').addEventListener('click', () => {
                scale = Math.max(scale / 1.2, 0.5);
                updateTransform();
            });

            document.getElementById('reset').addEventListener('click', () => {
                scale = 1;
                translateX = initialTranslateX;
                translateY = 0;
                updateTransform();
            });

            document.getElementById('regenerateDetections').addEventListener('click', () => {
                if (generatedImageUrl) {
                    runImageAnalysis();
                }
            });

            document.getElementById('objectCount').addEventListener('input', function() {
                document.getElementById('objectCountValue').textContent = this.value;
            });

            document.getElementById('confidenceThreshold').addEventListener('input', function() {
                confidenceThreshold = parseInt(this.value);
                document.getElementById('confidenceValue').textContent = this.value + '%';
                
                if (imageAnalyzed && currentDetections.length > 0) {
                    const filteredDetections = currentDetections.filter(
                        detection => detection.score * 100 >= confidenceThreshold
                    );
                    drawDetections(filteredDetections, document.getElementById('detectionCanvas'), imageWidth, imageHeight);
                }
            });

            document.getElementById('showLabels').addEventListener('change', function() {
                showLabels = this.checked;
                if (currentDetections.length > 0) {
                    const filteredDetections = currentDetections.filter(
                        detection => detection.score * 100 >= confidenceThreshold
                    );
                    drawDetections(filteredDetections, document.getElementById('detectionCanvas'), imageWidth, imageHeight);
                }
            });

            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                const delta = e.deltaY > 0 ? 0.9 : 1.1;
                scale = Math.max(0.5, Math.min(scale * delta, 3));
                updateTransform();
            });

            container.style.cursor = 'grab';
        }

        function updateTransform() {
            const imageContainer = document.getElementById('imageContainer');
            imageContainer.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        }

        function getObjectColor(objectClass) {
            const lowerClass = objectClass.toLowerCase();
            for (const key in colorMap) {
                if (lowerClass.includes(key)) {
                    return colorMap[key];
                }
            }
            return colorMap.default;
        }

        function drawDetections(detections, canvas, imageWidth, imageHeight) {
            const ctx = canvas.getContext('2d');
            canvas.width = imageWidth;
            canvas.height = imageHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const statusInfo = document.getElementById('statusInfo');
            statusInfo.innerHTML = `Detected ${detections.length} objects<br>Confidence threshold: ${confidenceThreshold}%<br>Drag to explore, use wheel or buttons to zoom`;

            detections.forEach(detection => {
                const [x, y, width, height] = detection.bbox;
                const objectClass = detection.class;
                const color = getObjectColor(objectClass);
                const confidence = Math.round(detection.score * 100);

                if (confidence < confidenceThreshold) return;

                ctx.lineWidth = 3;
                ctx.strokeStyle = color;
                ctx.setLineDash([5, 3]); 
                ctx.strokeRect(x, y, width, height);
                ctx.setLineDash([]);
                
                ctx.fillStyle = `${color}33`; 
                ctx.fillRect(x, y, width, height);

                const cornerSize = Math.min(15, width/4, height/4);
                ctx.lineWidth = 4;
                
                ctx.beginPath();
                ctx.moveTo(x, y + cornerSize);
                ctx.lineTo(x, y);
                ctx.lineTo(x + cornerSize, y);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(x + width - cornerSize, y);
                ctx.lineTo(x + width, y);
                ctx.lineTo(x + width, y + cornerSize);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(x + width, y + height - cornerSize);
                ctx.lineTo(x + width, y + height);
                ctx.lineTo(x + width - cornerSize, y + height);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(x + cornerSize, y + height);
                ctx.lineTo(x, y + height);
                ctx.lineTo(x, y + height - cornerSize);
                ctx.stroke();

                if (showLabels) {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                    const label = `${detection.class} ${confidence}%`;
                    ctx.font = 'bold 16px Arial';
                    const textWidth = ctx.measureText(label).width + 10;
                    
                    const labelX = x;
                    const labelY = y > 30 ? y - 30 : y + height + 30;
                    
                    ctx.fillRect(labelX, labelY, textWidth, 26);

                    ctx.fillStyle = color;
                    ctx.fillRect(labelX, labelY, 5, 26);

                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillText(
                        label,
                        labelX + 8, labelY + 18
                    );
                }
            });
        }

        function simulateProgressBar(durationMs) {
            const progressFill = document.getElementById('progressFill');
            progressFill.style.width = '0%';
            
            const startTime = Date.now();
            const interval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(100, (elapsed / durationMs) * 100);
                progressFill.style.width = `${progress}%`;
                
                if (progress >= 100) {
                    clearInterval(interval);
                }
            }, 50);
            
            return new Promise(resolve => {
                setTimeout(resolve, durationMs);
            });
        }

        function generateSmartAsylumObjectDetections(imgWidth, imgHeight) {
            const detections = [];
            const objectCount = parseInt(document.getElementById('objectCount').value);
            
            function hasCollision(bbox1, bbox2, objectType1, objectType2) {
                if ((objectType1 === "Hospital Bed" && objectType2 === "Restraint Straps") ||
                    (objectType2 === "Hospital Bed" && objectType1 === "Restraint Straps")) {
                    return false; 
                }

                let padding = 10;
                
                if ((objectType1.zone === "floor" && objectType2.zone === "floor")) {
                    padding = 5;
                }
                
                if ((objectType1.zone === "wall" && objectType2.zone === "wall")) {
                    padding = 20;
                }
                
                return !(
                    bbox1[0] + bbox1[2] + padding < bbox2[0] || 
                    bbox1[0] > bbox2[0] + bbox2[2] + padding || 
                    bbox1[1] + bbox1[3] + padding < bbox2[1] || 
                    bbox1[1] > bbox2[1] + bbox2[3] + padding    
                );
            }
            
            function randomInRange(min, max, skew = 0) {
                let u = Math.random();
                if (skew > 0) {
                    u = Math.pow(u, skew);
                } else if (skew < 0) {
                    u = 1 - Math.pow(1 - u, Math.abs(skew));
                }
                return min + u * (max - min);
            }
            
            const sensitivity = objectCount / 10; 
            const availableObjects = asylumObjects.filter(obj => Math.random() < obj.probability * sensitivity);
            const shuffledObjects = [...availableObjects].sort(() => Math.random() - 0.5);
            
            const criticalObjects = ["Hospital Bed", "Door with Observation Window", "Barred Window", "Ceiling Light"];
            let placedTypes = new Set();
            
            let attempts = 0;
            const maxAttempts = 200;
            
            for (const criticalType of criticalObjects) {
                const object = shuffledObjects.find(o => o.class === criticalType);
                if (!object) continue;
                
                for (let i = 0; i < 10; i++) {
                    let x, y, width, height;
                    
                    if (object.class === "Hospital Bed") {
                        const side = Math.random() > 0.5 ? "left" : "right";
                        x = side === "left" ? 
                            randomInRange(0.05, 0.15, 1) * imgWidth : 
                            randomInRange(0.75, 0.9, 1) * imgWidth;
                        y = randomInRange(0.55, 0.7, 0.5) * imgHeight;
                    } else if (object.class === "Door with Observation Window") {
                        x = randomInRange(0.4, 0.6, 0) * imgWidth;
                        y = randomInRange(0.6, 0.85, -1) * imgHeight;
                    } else if (object.class === "Barred Window") {
                        x = randomInRange(0.2, 0.8, 0) * imgWidth;
                        y = randomInRange(0.1, 0.3, 1) * imgHeight;
                    } else if (object.class === "Ceiling Light") {
                        x = randomInRange(0.3, 0.7, 0) * imgWidth;
                        y = randomInRange(0.05, 0.15, 1) * imgHeight;
                    } else {
                        x = randomInRange(object.position.x[0], object.position.x[1], 0) * imgWidth;
                        y = randomInRange(object.position.y[0], object.position.y[1], 0) * imgHeight;
                    }
                    
                    const perspectiveFactor = 0.7 + (y / imgHeight) * 0.6;
                    width = randomInRange(object.size.width[0], object.size.width[1], 0) * imgWidth * perspectiveFactor;
                    height = randomInRange(object.size.height[0], object.size.height[1], 0) * imgHeight * perspectiveFactor;
                    
                    const newBBox = [x, y, width, height];
                    
                    let hasOverlap = false;
                    for (const detection of detections) {
                        if (hasCollision(newBBox, detection.bbox, object, detection.object)) {
                            hasOverlap = true;
                            break;
                        }
                    }
                    
                    if (!hasOverlap && 
                        x >= 0 && y >= 0 && 
                        x + width <= imgWidth && 
                        y + height <= imgHeight) {
                        detections.push({
                            class: object.class,
                            score: 0.8 + Math.random() * 0.19, 
                            bbox: newBBox,
                            object: object
                        });
                        placedTypes.add(object.class);
                        break;
                    }
                }
            }
            
            while (detections.length < objectCount && attempts < maxAttempts && shuffledObjects.length > 0) {
                let objectIndex = 0;
                let object;
                
                for (let i = 0; i < shuffledObjects.length; i++) {
                    if (!placedTypes.has(shuffledObjects[i].class)) {
                        objectIndex = i;
                        object = shuffledObjects[i];
                        break;
                    }
                }
                
                if (!object) {
                    objectIndex = attempts % shuffledObjects.length;
                    object = shuffledObjects[objectIndex];
                }
                
                let x, y, width, height;
                
                if (object.zone === "floor") {
                    x = randomInRange(object.position.x[0], object.position.x[1], 0) * imgWidth;
                    y = randomInRange(Math.max(0.5, object.position.y[0]), object.position.y[1], -0.5) * imgHeight;
                } 
                else if (object.zone === "wall") {
                    const side = Math.random() > 0.5 ? "left" : "right";
                    if (side === "left") {
                        x = randomInRange(0.05, 0.2, 1) * imgWidth;
                    } else {
                        x = randomInRange(0.8, 0.95, -1) * imgWidth;
                    }
                    y = randomInRange(object.position.y[0], object.position.y[1], 0) * imgHeight;
                }
                else if (object.zone === "ceiling") {
                    x = randomInRange(object.position.x[0], object.position.x[1], 0) * imgWidth;
                    y = randomInRange(0.05, Math.min(0.2, object.position.y[1]), 1) * imgHeight;
                }
                else {
                    x = randomInRange(object.position.x[0], object.position.x[1], 0) * imgWidth;
                    y = randomInRange(object.position.y[0], object.position.y[1], 0) * imgHeight;
                }
                
                const perspectiveFactor = 0.7 + (y / imgHeight) * 0.6;
                width = randomInRange(object.size.width[0], object.size.width[1], 0) * imgWidth * perspectiveFactor;
                height = randomInRange(object.size.height[0], object.size.height[1], 0) * imgHeight * perspectiveFactor;
                
                const newBBox = [x, y, width, height];
                
                let hasOverlap = false;
                for (const detection of detections) {
                    if (hasCollision(newBBox, detection.bbox, object, detection.object)) {
                        hasOverlap = true;
                        break;
                    }
                }
                
                if (!hasOverlap && 
                    x >= 0 && y >= 0 && 
                    x + width <= imgWidth && 
                    y + height <= imgHeight) {
                    detections.push({
                        class: object.class,
                        score: 0.7 + Math.random() * 0.29, 
                        bbox: newBBox,
                        object: object
                    });
                    placedTypes.add(object.class);
                }
                
                attempts++;
            }
            
            return detections;
        }

        async function runImageAnalysis() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('loading').innerText = 'Analyzing image for objects...';
            
            const detectionCanvas = document.getElementById('detectionCanvas');
            const ctx = detectionCanvas.getContext('2d');
            ctx.clearRect(0, 0, detectionCanvas.width, detectionCanvas.height);
            
            await simulateProgressBar(2500);
            
            const detections = generateSmartAsylumObjectDetections(imageWidth, imageHeight);
            currentDetections = detections;
            imageAnalyzed = true;
            
            if (detections && detections.length > 0) {
                const filteredDetections = detections.filter(
                    detection => detection.score * 100 >= confidenceThreshold
                );
                drawDetections(filteredDetections, detectionCanvas, imageWidth, imageHeight);
            }
            
            document.getElementById('loading').style.display = 'none';
        }

        async function main() {
            try {
