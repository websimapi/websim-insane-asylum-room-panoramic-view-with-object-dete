<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insane Asylum Room - Panoramic View with Object Detection</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
            background-color: #000;
        }
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 20px;
            border-radius: 10px;
        }
        #imageContainer {
            position: relative;
            height: 100%;
            transform-origin: center center;
            transition: transform 0.1s ease;
        }
        #panoramaImage {
            height: 100%;
            display: none;
        }
        #detectionCanvas {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            pointer-events: none;
            transform-origin: center center;
        }
        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 10px;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
        }
        .controls button {
            padding: 8px 15px;
            background: #333;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        .controls button:hover {
            background: #555;
        }
        #statusInfo {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 10;
        }
        #detectionSettings {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 10;
        }
        label {
            display: block;
            margin: 5px 0;
        }
        input[type="range"] {
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="loading">Generating image of insane asylum room...</div>
        <div id="statusInfo"></div>
        <div id="detectionSettings">
            <label>Object Count: <span id="objectCountValue">8</span>
                <input type="range" id="objectCount" min="3" max="15" value="8">
            </label>
            <label>
                <input type="checkbox" id="showLabels" checked> Show Labels
            </label>
            <button id="regenerateDetections">Regenerate Detections</button>
        </div>
        <div id="imageContainer">
            <img id="panoramaImage" alt="Insane Asylum Room">
            <canvas id="detectionCanvas"></canvas>
        </div>
        <div class="controls">
            <button id="zoomIn">Zoom In</button>
            <button id="zoomOut">Zoom Out</button>
            <button id="reset">Reset View</button>
        </div>
    </div>

    <script type="module">
        let isDragging = false;
        let startX, startY, translateX = 0, translateY = 0, scale = 1;
        let containerWidth, containerHeight, imageWidth, imageHeight;
        let initialTranslateX = 0;
        let currentDetections = [];
        let generatedImageUrl = '';
        let showLabels = true;

        // Asylum room objects with their relative positioning probabilities
        const asylumObjects = [
            {
                class: "Hospital Bed",
                position: { x: [0.1, 0.7], y: [0.3, 0.8] },
                size: { width: [0.15, 0.3], height: [0.1, 0.25] },
                probability: 0.9
            },
            {
                class: "Wheelchair",
                position: { x: [0.05, 0.9], y: [0.4, 0.9] },
                size: { width: [0.08, 0.12], height: [0.1, 0.18] },
                probability: 0.7
            },
            {
                class: "Medical Cabinet",
                position: { x: [0.05, 0.9], y: [0.1, 0.9] },
                size: { width: [0.05, 0.15], height: [0.1, 0.3] },
                probability: 0.8
            },
            {
                class: "IV Stand",
                position: { x: [0.1, 0.9], y: [0.3, 0.9] },
                size: { width: [0.03, 0.08], height: [0.1, 0.25] },
                probability: 0.6
            },
            {
                class: "Barred Window",
                position: { x: [0.05, 0.95], y: [0.05, 0.4] },
                size: { width: [0.08, 0.2], height: [0.1, 0.3] },
                probability: 0.8
            },
            {
                class: "Restraint Straps",
                position: { x: [0.1, 0.8], y: [0.3, 0.8] },
                size: { width: [0.1, 0.25], height: [0.05, 0.1] },
                probability: 0.7
            },
            {
                class: "Medicine Tray",
                position: { x: [0.1, 0.9], y: [0.3, 0.9] },
                size: { width: [0.05, 0.15], height: [0.05, 0.1] },
                probability: 0.5
            },
            {
                class: "Patient Chart",
                position: { x: [0.1, 0.9], y: [0.1, 0.9] },
                size: { width: [0.05, 0.1], height: [0.05, 0.1] },
                probability: 0.4
            },
            {
                class: "Rusty Sink",
                position: { x: [0.05, 0.95], y: [0.3, 0.8] },
                size: { width: [0.08, 0.15], height: [0.1, 0.2] },
                probability: 0.6
            },
            {
                class: "Ceiling Light",
                position: { x: [0.2, 0.8], y: [0.05, 0.2] },
                size: { width: [0.05, 0.15], height: [0.05, 0.1] },
                probability: 0.9
            },
            {
                class: "Door with Observation Window",
                position: { x: [0.3, 0.7], y: [0.6, 0.95] },
                size: { width: [0.1, 0.2], height: [0.2, 0.35] },
                probability: 0.8
            },
            {
                class: "Medical Waste Bin",
                position: { x: [0.05, 0.95], y: [0.6, 0.95] },
                size: { width: [0.05, 0.1], height: [0.08, 0.15] },
                probability: 0.5
            },
            {
                class: "Blood Stain",
                position: { x: [0.1, 0.9], y: [0.1, 0.9] },
                size: { width: [0.05, 0.2], height: [0.05, 0.2] },
                probability: 0.4
            },
            {
                class: "Treatment Chair",
                position: { x: [0.1, 0.9], y: [0.3, 0.8] },
                size: { width: [0.1, 0.2], height: [0.15, 0.25] },
                probability: 0.6
            },
            {
                class: "Peeling Wallpaper",
                position: { x: [0.0, 1.0], y: [0.0, 0.5] },
                size: { width: [0.1, 0.3], height: [0.1, 0.3] },
                probability: 0.7
            },
            {
                class: "Medical Trolley",
                position: { x: [0.1, 0.9], y: [0.4, 0.9] },
                size: { width: [0.1, 0.2], height: [0.08, 0.15] },
                probability: 0.6
            },
            {
                class: "Patient Slippers",
                position: { x: [0.1, 0.9], y: [0.7, 0.95] },
                size: { width: [0.05, 0.1], height: [0.03, 0.08] },
                probability: 0.3
            },
            {
                class: "Electroshock Machine",
                position: { x: [0.1, 0.9], y: [0.3, 0.8] },
                size: { width: [0.1, 0.2], height: [0.1, 0.2] },
                probability: 0.5
            }
        ];

        // Color schemes for different object categories
        const colorMap = {
            'bed': '#8B4513',
            'patient': '#8B4513',
            'hospital': '#8B4513',
            'chair': '#556B2F',
            'wheelchair': '#2F4F4F',
            'restraint': '#8B0000',
            'window': '#4682B4',
            'barred': '#4682B4',
            'door': '#A0522D',
            'cabinet': '#A52A2A',
            'medical': '#483D8B',
            'sink': '#5F9EA0',
            'light': '#DAA520',
            'lamp': '#DAA520',
            'table': '#8B0000',
            'blood': '#B22222',
            'stain': '#8B0000',
            'chart': '#708090',
            'electroshock': '#800080',
            'trolley': '#708090',
            'waste': '#696969',
            'wallpaper': '#A9A9A9',
            'default': '#FF4500'
        };

        function setupPanoramicViewer() {
            const container = document.getElementById('container');
            const imageContainer = document.getElementById('imageContainer');
            const panoramaImage = document.getElementById('panoramaImage');

            containerWidth = container.clientWidth;
            containerHeight = container.clientHeight;
            imageWidth = panoramaImage.naturalWidth;
            imageHeight = panoramaImage.naturalHeight;

            initialTranslateX = (containerWidth - imageWidth) / 2;
            translateX = initialTranslateX;

            updateTransform();

            container.addEventListener('mousedown', (e) => {
                isDragging = true;
                startX = e.clientX - translateX;
                startY = e.clientY - translateY;
                container.style.cursor = 'grabbing';
            });

            container.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                translateX = e.clientX - startX;
                translateY = e.clientY - startY;

                translateY = Math.max(Math.min(translateY, containerHeight / 2), -imageHeight * scale + containerHeight / 2);

                updateTransform();
            });

            container.addEventListener('mouseup', () => {
                isDragging = false;
                container.style.cursor = 'grab';
            });

            container.addEventListener('mouseleave', () => {
                isDragging = false;
                container.style.cursor = 'grab';
            });

            document.getElementById('zoomIn').addEventListener('click', () => {
                scale = Math.min(scale * 1.2, 3);
                updateTransform();
            });

            document.getElementById('zoomOut').addEventListener('click', () => {
                scale = Math.max(scale / 1.2, 0.5);
                updateTransform();
            });

            document.getElementById('reset').addEventListener('click', () => {
                scale = 1;
                translateX = initialTranslateX;
                translateY = 0;
                updateTransform();
            });

            document.getElementById('regenerateDetections').addEventListener('click', () => {
                if (generatedImageUrl) {
                    document.getElementById('loading').style.display = 'block';
                    document.getElementById('loading').innerText = 'Regenerating object detections...';
                    setTimeout(() => {
                        const detections = generateAsylumObjectDetections(imageWidth, imageHeight);
                        if (detections && detections.length > 0) {
                            drawDetections(detections, document.getElementById('detectionCanvas'), imageWidth, imageHeight);
                        }
                        document.getElementById('loading').style.display = 'none';
                    }, 1000);
                }
            });

            document.getElementById('objectCount').addEventListener('input', function() {
                document.getElementById('objectCountValue').textContent = this.value;
            });

            document.getElementById('showLabels').addEventListener('change', function() {
                showLabels = this.checked;
                if (currentDetections.length > 0) {
                    drawDetections(currentDetections, document.getElementById('detectionCanvas'), imageWidth, imageHeight);
                }
            });

            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                const delta = e.deltaY > 0 ? 0.9 : 1.1;
                scale = Math.max(0.5, Math.min(scale * delta, 3));
                updateTransform();
            });

            container.style.cursor = 'grab';
        }

        function updateTransform() {
            const imageContainer = document.getElementById('imageContainer');
            imageContainer.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        }

        function getObjectColor(objectClass) {
            const lowerClass = objectClass.toLowerCase();
            for (const key in colorMap) {
                if (lowerClass.includes(key)) {
                    return colorMap[key];
                }
            }
            return colorMap.default;
        }

        function drawDetections(detections, canvas, imageWidth, imageHeight) {
            const ctx = canvas.getContext('2d');
            canvas.width = imageWidth;
            canvas.height = imageHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            currentDetections = detections;

            const statusInfo = document.getElementById('statusInfo');
            statusInfo.innerHTML = `Detected ${detections.length} objects<br>Drag to explore, use wheel or buttons to zoom`;

            detections.forEach(detection => {
                const [x, y, width, height] = detection.bbox;
                const objectClass = detection.class;
                const color = getObjectColor(objectClass);

                // Draw bounding box
                ctx.lineWidth = 3;
                ctx.strokeStyle = color;
                ctx.strokeRect(x, y, width, height);
                
                // Fill with semi-transparent color
                ctx.fillStyle = `${color}33`; 
                ctx.fillRect(x, y, width, height);

                // Draw label if enabled
                if (showLabels) {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                    const label = `${detection.class} ${Math.round(detection.score * 100)}%`;
                    const textWidth = ctx.measureText(label).width + 10;
                    ctx.fillRect(x, y > 24 ? y - 24 : y, textWidth, 24);

                    ctx.font = 'bold 16px Arial';
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillText(
                        label,
                        x + 5, y > 20 ? y - 8 : y + 18
                    );
                }
            });
        }

        function generateAsylumObjectDetections(imgWidth, imgHeight) {
            const detections = [];
            const objectCount = parseInt(document.getElementById('objectCount').value);
            
            // Check for collision between two boxes
            function hasCollision(bbox1, bbox2, padding = 10) {
                return !(
                    bbox1[0] + bbox1[2] + padding < bbox2[0] || // box1 right < box2 left
                    bbox1[0] > bbox2[0] + bbox2[2] + padding || // box1 left > box2 right
                    bbox1[1] + bbox1[3] + padding < bbox2[1] || // box1 bottom < box2 top
                    bbox1[1] > bbox2[1] + bbox2[3] + padding    // box1 top > box2 bottom
                );
            }
            
            // Generate random value within a range
            function randomInRange(min, max) {
                return min + Math.random() * (max - min);
            }
            
            // Filter objects based on their probability
            const availableObjects = asylumObjects.filter(obj => Math.random() < obj.probability);
            const shuffledObjects = [...availableObjects].sort(() => Math.random() - 0.5);
            
            let attempts = 0;
            const maxAttempts = 50;
            
            // Try to create non-overlapping objects
            while (detections.length < objectCount && attempts < maxAttempts && shuffledObjects.length > 0) {
                const objectIndex = attempts % shuffledObjects.length;
                const object = shuffledObjects[objectIndex];
                
                const x = Math.floor(randomInRange(object.position.x[0], object.position.x[1]) * imgWidth);
                const y = Math.floor(randomInRange(object.position.y[0], object.position.y[1]) * imgHeight);
                const width = Math.floor(randomInRange(object.size.width[0], object.size.width[1]) * imgWidth);
                const height = Math.floor(randomInRange(object.size.height[0], object.size.height[1]) * imgHeight);
                
                const newBBox = [x, y, width, height];
                
                // Check if the new box collides with any existing box
                let hasOverlap = false;
                for (const detection of detections) {
                    if (hasCollision(newBBox, detection.bbox)) {
                        hasOverlap = true;
                        break;
                    }
                }
                
                if (!hasOverlap && 
                    x >= 0 && y >= 0 && 
                    x + width <= imgWidth && 
                    y + height <= imgHeight) {
                    detections.push({
                        class: object.class,
                        score: 0.7 + Math.random() * 0.29, // Random confidence between 70-99%
                        bbox: newBBox
                    });
                }
                
                attempts++;
            }
            
            return detections;
        }

        async function main() {
            try {
                document.getElementById('loading').innerText = 'Generating high-detail image of asylum room...';
                const result = await websim.imageGen({
                    prompt: "A detailed panoramic view of an abandoned insane asylum room with peeling wallpaper, old medical equipment, broken furniture, eerie lighting through barred windows, and disturbing details. Cinematic, hyper-realistic, high detail, creepy atmosphere.",
                    width: 1792,  
                    height: 1024
                });

                console.log("Image generated:", result.url);
                generatedImageUrl = result.url;

                const panoramaImage = document.getElementById('panoramaImage');
                panoramaImage.crossOrigin = "Anonymous";
                panoramaImage.src = result.url;

                await new Promise((resolve) => {
                    panoramaImage.onload = resolve;
                });

                panoramaImage.style.display = 'block';

                setupPanoramicViewer();

                document.getElementById('loading').innerText = 'Analyzing objects in the image...';

                imageWidth = panoramaImage.naturalWidth;
                imageHeight = panoramaImage.naturalHeight;

                const detectionCanvas = document.getElementById('detectionCanvas');

                // Generate object detections for the asylum room
                const detections = generateAsylumObjectDetections(imageWidth, imageHeight);

                drawDetections(detections, detectionCanvas, imageWidth, imageHeight);

                document.getElementById('loading').style.display = 'none';

            } catch (error) {
                console.error("Error:", error);
                document.getElementById('loading').innerText = 'Error: ' + error.message;
            }
        }

        window.addEventListener('DOMContentLoaded', main);
    </script>
